name: corn-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corn_research}
      POSTGRES_USER: ${POSTGRES_USER:-corn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Applied only to a NEW volume. Existing databases need reviewed upgrades.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    logging: *logging

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    # Cursors/locks are durable state, not an evictable cache.
    command: ["sh", "-ec", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory 384mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 768m
    logging: *logging

  backend:
    image: corn-backend:${RELEASE_VERSION:-phase2-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-corn_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-corn_research}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      SERVER_PORT: "8000"
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,sea_orm=warn}
      RUST_LOG_FORMAT: json
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
      TZ: UTC
      COLLECTOR_LOG_LEVEL: ${COLLECTOR_LOG_LEVEL:-INFO}
      COLLECTOR_LOG_DIR: /app/logs/collectors
      COLLECTOR_LOG_MAX_BYTES: ${COLLECTOR_LOG_MAX_BYTES:-10485760}
      COLLECTOR_LOG_BACKUP_COUNT: ${COLLECTOR_LOG_BACKUP_COUNT:-5}
      BOYAR_START_ARTICLE_ID: ${BOYAR_START_ARTICLE_ID:-1267743}
      BOYAR_SCAN_LIMIT: ${BOYAR_SCAN_LIMIT:-150}
      SINA_FUTURES_SYMBOLS: ${SINA_FUTURES_SYMBOLS:-nf_C0}
      DCE_CONTRACTS: ${DCE_CONTRACTS:-}
      DCE_START_DATE: ${DCE_START_DATE:-}
      DCE_MAX_DAYS: ${DCE_MAX_DAYS:-31}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    logging: *logging

  frontend:
    image: corn-frontend:${RELEASE_VERSION:-phase2-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend}
    environment:
      NODE_ENV: production
      TZ: UTC
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3080}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    logging: *logging

  # Requires certificates and an htpasswd file; no unauthenticated public API.
  nginx:
    image: nginx:stable-alpine
    profiles: ["gateway"]
    ports:
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

volumes:
  postgres_data:
  redis_data:
