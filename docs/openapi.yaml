          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSource'
            example: &id050
              name: 更新后的名称
    delete:
      operationId: delete_source
      tags:
      - Sources
      summary: 删除数据源
      description: 资源不存在也成功。可能级联删除关联记录/运行历史；async_jobs 外键限制可能导致 500。生产调用前确认依赖和备份。
      responses:
