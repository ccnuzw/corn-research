openapi: 3.0.3
info:
  title: CornV2 Backend API
  version: 0.1.0-worktree-2026-10-22
  description: 基于本地 Rust 工作树生成的当前行为契约，不是未来能力承诺。46 个操作；示例为示意，不代表实时行情或真实采集条数。无认证，生产环境必须在可信网络或有认证的网关后使用。
servers:
- url: http://localhost:18000
  description: 本地 Docker 映射端口，路径已包含 /api（health 除外）。
tags:
- name: Health
- name: Sources
- name: Adapters
- name: Topics
- name: Records
- name: Collectors
- name: AsyncJobs
- name: Data
- name: Quality
- name: Lineage
- name: Notifications
- name: Scheduler
security: []
paths:
  /health:
    get:
      operationId: health_check
      tags:
      - Health
      summary: 存活检查
      description: 固定返回存活字符串；不检查 PostgreSQL、Redis、采集器或调度器就绪状态。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: string
                  message:
                    type: string
                    nullable: true
                required:
                - success
                - data
                - message
              example:
                success: true
                data: Corn Backend V2 is running
                message: null
      x-source-handler: health_check
  /api/sources:
    get:
      operationId: list_sources
      tags:
      - Sources
      summary: 列出数据源
      description: 按名称升序。无分页。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
                  message:
                    type: string
                    nullable: true
                required:
                - success
                - data
                - message
              example:
                success: true
                data:
                - &id001
                  id: source_sina
                  name: 新浪财经
                  domain: finance.sina.com.cn
                  description: 玉米市场价格
                  status: active
                  created_at: '2026-10-22T01:00:00Z'
                  updated_at: '2026-10-22T01:00:00Z'
                message: null
        '500':
          description: 数据库、采集器或内部错误。 空响应体。
      x-source-handler: collection_handlers::list_sources
    post:
      operationId: create_source
      tags:
      - Sources
      summary: 创建数据源
      description: 成功 HTTP 200（不是 201）。状态初始化为 active。 重复主键或外键错误目前返回 500，不是 409。
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Source'
                  message:
                    type: string
                    nullable: true
                required:
                - success
                - data
                - message
              example:
                success: true
                data: *id001
                message: Source created successfully
        '500':
          description: 数据库、采集器或内部错误。 空响应体。
        '413':
          description: JSON 请求体超过默认限制（通常为 2 MiB）。
          content:
            text/plain:
              schema:
                type: string
              example: 'Failed to buffer the request body: length limit exceeded'
        '400':
          description: 路径/查询/JSON 语法解析失败（Axum）；处理函数也可能返回该状态。
          content:
            text/plain:
              schema:
                type: string
              example: 'Failed to deserialize the JSON body: EOF while parsing a value'
        '422':
          description: JSON 字段缺失、类型不匹配，或 collector_name/collector_id 重复。
          content:
            text/plain:
              schema:
                type: string
              example: Failed to deserialize the JSON body into the target type
        '415':
          description: JSON 请求缺少或使用了错误的 Content-Type。
          content:
            text/plain:
              schema:
                type: string
              example: 'Expected request with `Content-Type: application/json`'
      x-source-handler: collection_handlers::create_source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSource'
            example: &id049
              id: source_example
              name: 示例数据源
              domain: example.org
              description: 示例
