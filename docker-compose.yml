version: '3.8'

services:
  # ============================================
  # PostgreSQL + TimescaleDB
  # ============================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: corn_postgres
    environment:
      POSTGRES_DB: corn_research
      POSTGRES_USER: corn_user
      POSTGRES_PASSWORD: corn_password_2026
      TIMESCALEDB_TELEMETRY: off
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corn_user -d corn_research"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - corn-network

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: corn_redis
    ports:
      - "16380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - corn-network

  # ============================================
  # Rust Backend + Python Collectors (PyO3)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corn_backend
    environment:
      RUST_LOG: info
      DATABASE_URL: postgresql://corn_user:corn_password_2026@postgres:5432/corn_research
      REDIS_URL: redis://redis:6379/0
    ports:
      - "18000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - corn-network

  # ============================================
  # Next.js Frontend
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: corn_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18000
    ports:
      - "3080:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - corn-network

  # ============================================
  # Nginx (生产环境)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: corn_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/out:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    profiles:
      - production
    networks:
      - corn-network

volumes:
  postgres_data:
  redis_data:

networks:
  corn-network:
    driver: bridge
